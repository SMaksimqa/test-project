name: Morning News

on:
  schedule:
    # GitHub Actions использует UTC. 06:05 UTC = 09:05 МСК (UTC+3).
    # Не ставим ровно на :00 — начало часа перегружено, запуски там
    # часто задерживаются или пропускаются (рекомендация GitHub).
    - cron: "5 6 * * *"
  workflow_dispatch: {}

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Send morning digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          HERMES_API_KEY: ${{ secrets.HERMES_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          HERMES_MODEL: ${{ vars.HERMES_MODEL }}
        run: python -m newsbot
