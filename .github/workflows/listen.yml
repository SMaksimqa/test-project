name: News Listener

on:
  # Опрос чата раз в ~10 минут: бот отвечает на слово «новости» с задержкой.
  # GitHub использует UTC; для интервального cron время суток не важно.
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

# Не запускаем несколько проверок одновременно — они читают один поток getUpdates.
concurrency:
  group: telegram-listener
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Poll Telegram for "новости"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          HERMES_API_KEY: ${{ secrets.HERMES_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          HERMES_MODEL: ${{ vars.HERMES_MODEL }}
        run: python -m newsbot.listen poll
